map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# HSTS follows actual TLS, never cookie settings or client-controlled forwarded headers.
# The stock Compose nginx profile is HTTP-only. Its external TLS terminator must set HSTS.
# If terminating TLS here, configure listen 443 ssl plus certificates; this map then applies.
map $https $hsts { default ""; on "max-age=31536000"; }
server {
    listen 80;
    add_header Strict-Transport-Security $hsts always;
    # Stock nginx has gzip, not zstd; keep API responses out of compression.
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_proxied any;
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
