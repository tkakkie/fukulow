# Include inside nginx's http block. Set FUKULOW_DOMAIN=chat.example.com.
# Install a trusted certificate and key at the paths below and run nginx -t.
map $http_upgrade $fukulow_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chat.example.com;
    if ($http_host !~* ^chat\.example\.com$) { return 421; }
    return 308 https://chat.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.example.com;
    ssl_certificate /etc/nginx/tls/chat.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/chat.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($http_host !~* ^chat\.example\.com$) { return 421; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fukulow_connection;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite the client-supplied field. Origin passes through as received.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }
}
