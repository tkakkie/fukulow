[package]
name = "fukulow-client-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
fukulow-api = { path = "../api-types" }
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["serde"] }

serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]
