name: version-check
on:
  schedule:
    - cron: "23 0 * * 1" # weekly, Monday (UTC)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: { group: version-check }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Build the report (upstream failures are listed in it)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/version-report.ts > "$RUNNER_TEMP/version-check.json"
      - name: Sync the Version check Issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/version-check-issue.ts "$RUNNER_TEMP/version-check.json"
