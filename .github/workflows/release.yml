name: release
# #808: a maintainer-created vX.Y.Z or vX.Y.Z-pre tag publishes ghcr.io/tkakkie/fukulow.
# Pull requests touching the release path run a dry run: the same build and checks, no push.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml, 'scripts/release-*.ts', Dockerfile, .dockerignore, compose.yml]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tags: ${{ steps.plan.outputs.tags }}
      latest: ${{ steps.plan.outputs.latest }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - name: Tag is SemVer; plan image tags (pre-releases never move X.Y or latest)
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
        run: node scripts/release-version.ts "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: Tagged commit is on main and its main push CI succeeded
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release-gate.ts

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    # Native runners: no emulation for the Rust release build.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build from source without cache, export the OCI archive
        # The docker exporter writes the same OCI layout plus manifest.json, which `docker load` needs.
        id: build
        run: |
          # Dry runs and releases both require the #807 workspace license.
          license=$(node scripts/release-oci.ts license)
          echo "license=$license" >> "$GITHUB_OUTPUT"
          ARCHIVE="$RUNNER_TEMP/image-$ARCH.tar"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) docker buildx build --platform "linux/$ARCH" \
            --provenance=false --sbom=false --pull --no-cache \
            --label "org.opencontainers.image.source=https://github.com/tkakkie/fukulow" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=$license" \
            --output "type=docker,oci-mediatypes=true,dest=$ARCHIVE,name=fukulow-release:$ARCH,rewrite-timestamp=true" .
      - name: Platform, non-root user and OCI labels
        env:
          LICENSE: ${{ steps.build.outputs.license }}
        run: node scripts/release-oci.ts check "$ARCHIVE" "$ARCH" "$VERSION" "$GITHUB_SHA" "$LICENSE"
      - name: Load the exact archive for the pre-publish checks
        run: docker load -i "$ARCHIVE"
      - name: License and notice files (#807)
        run: bash scripts/check-image-licenses.sh "fukulow-release:$ARCH"
      - name: Compose security smoke with this image on both proxy profiles
        env:
          CHECK_COMPOSE_IMAGE: fukulow-release:${{ matrix.arch }}
        run: |
          CHECK_COMPOSE_PROFILE=caddy node scripts/check-compose-security.ts
          CHECK_COMPOSE_PROFILE=nginx node scripts/check-compose-security.ts
      - name: SPDX SBOM of the exact archive
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: oci-archive:${{ runner.temp }}/image-${{ matrix.arch }}.tar
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image-${{ matrix.arch }}.tar
            ${{ runner.temp }}/sbom-${{ matrix.arch }}.spdx.json
          retention-days: 3
          if-no-files-found: error

  # The only job with packages:write. It runs no build and no repository test code.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      index: ${{ steps.push.outputs.index-digest }}
      amd64: ${{ steps.push.outputs.amd64-digest }}
      arm64: ${{ steps.push.outputs.arm64-digest }}
    env:
      IMAGE: ghcr.io/tkakkie/fukulow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: release-*, merge-multiple: true, path: '${{ runner.temp }}/release' }
      - name: Push both platforms by digest, then the index and its tags
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAGS: ${{ needs.validate.outputs.tags }}
        run: |
          license=$(node scripts/release-oci.ts license)
          node scripts/release-registry.ts "$VERSION" "$GITHUB_SHA" "$license" "$TAGS" \
            "$RUNNER_TEMP/release/image-amd64.tar" "$RUNNER_TEMP/release/image-arm64.tar"
      # actions/attest pushes attestations with Docker's credential store.
      - name: Log in to GHCR for attestation pushes
        env: { REGISTRY_PASSWORD: '${{ github.token }}' }
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Attestations bind to digests, so moving X.Y or latest never moves them.
      - name: Provenance for the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.index-digest }}', push-to-registry: true, create-storage-record: false }
      - name: Provenance for linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.amd64-digest }}', push-to-registry: true, create-storage-record: false }
      - name: Provenance for linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.arm64-digest }}', push-to-registry: true, create-storage-record: false }
      - name: SBOM for linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.amd64-digest }}', sbom-path: '${{ runner.temp }}/release/sbom-amd64.spdx.json', push-to-registry: true, create-storage-record: false }
      - name: SBOM for linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.arm64-digest }}', sbom-path: '${{ runner.temp }}/release/sbom-arm64.spdx.json', push-to-registry: true, create-storage-record: false }
      - name: SBOM for the index (linux/amd64 contents)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.index-digest }}', sbom-path: '${{ runner.temp }}/release/sbom-amd64.spdx.json', push-to-registry: true, create-storage-record: false }
      - name: SBOM for the index (linux/arm64 contents)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.index-digest }}', sbom-path: '${{ runner.temp }}/release/sbom-arm64.spdx.json', push-to-registry: true, create-storage-record: false }
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Fresh host: pull the published index with compose.yml and rerun the Compose smoke.
  fresh-host:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      FUKULOW_VERSION: ${{ needs.validate.outputs.version }}@${{ needs.publish.outputs.index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      # gh attestation verify oci:// reads Docker's credentials; the package may still be private.
      - name: Log in to GHCR
        env: { REGISTRY_PASSWORD: '${{ github.token }}' }
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Attestations verify for the index and both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ needs.publish.outputs.index }} ${{ needs.publish.outputs.amd64 }} ${{ needs.publish.outputs.arm64 }}
        run: |
          for digest in $DIGESTS; do
            gh attestation verify "oci://ghcr.io/tkakkie/fukulow@$digest" --repo "$GITHUB_REPOSITORY" > /dev/null
            gh attestation verify "oci://ghcr.io/tkakkie/fukulow@$digest" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
          done
      - name: docker compose pull with compose.yml
        env:
          POSTGRES_PASSWORD: fresh-host-test-only
          POSTGRES_APP_PASSWORD: fresh-host-app-test-only
          FUKULOW_SETUP_TOKEN: fresh-host-setup-test-only
        run: |
          docker compose --env-file /dev/null -f compose.yml --profile caddy pull app migrate
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Compose security smoke with the pulled release on both proxy profiles
        env:
          CHECK_COMPOSE_IMAGE: ghcr.io/tkakkie/fukulow:${{ needs.validate.outputs.version }}@${{ needs.publish.outputs.index }}
        run: |
          CHECK_COMPOSE_PROFILE=caddy node scripts/check-compose-security.ts
          CHECK_COMPOSE_PROFILE=nginx node scripts/check-compose-security.ts

  release:
    needs: [validate, publish, fresh-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - name: GitHub Release with digests, upgrade notes and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAGS: ${{ needs.validate.outputs.tags }}
          PREVIOUS: ${{ needs.validate.outputs.previous }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LATEST: ${{ needs.validate.outputs.latest }}
          INDEX: ${{ needs.publish.outputs.index }}
          AMD64: ${{ needs.publish.outputs.amd64 }}
          ARM64: ${{ needs.publish.outputs.arm64 }}
        run: |
          node scripts/release-notes.ts "$TAG" "$VERSION" "$TAGS" "$INDEX" "$AMD64" "$ARM64" "$PREVIOUS" > "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "--latest=$LATEST")
          if [ -n "$PREVIOUS" ]; then flags+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
