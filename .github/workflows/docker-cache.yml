name: docker-cache
on:
  push:
    branches: [main]
permissions:
  contents: read
# #926: the only writer of the scope=docker layer cache; ci and e2e-compose only read it. One run at a time, so
# each run reads the layers the previous one exported instead of rebuilding a changed dependency layer beside it
# (the build is not reproducible, so parallel exports never deduplicate). A newer push replaces a pending run,
# whose export would be superseded anyway. No check runs here: ci and e2e-compose still build and verify every push.
concurrency:
  group: docker-cache
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and export the layer cache
        id: build-image
        timeout-minutes: 25
        # Like ci and e2e-compose, only the action's build child inherits cache credentials.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error("Actions cache credentials are not available");
            }
            // Same build as ci's docker job (compose.dev.yml), so its layers are the ones ci reads.
            await exec.exec("docker", ["buildx", "bake", "--file", "compose.dev.yml",
              "--set", "app.cache-from=type=gha,scope=docker",
              "--set", "app.cache-to=type=gha,scope=docker,mode=max"]);
