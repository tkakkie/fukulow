name: file-lines
# Report only (#851): lists files over the line-count guidance in the job summary. It never fails a PR.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: file-lines-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      # The merge commit's first parent is the base tip, so "changed" means changed by this PR.
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Files over the line-count guidance (report only)
        run: node scripts/report-file-lines.ts --base HEAD^1 || true
