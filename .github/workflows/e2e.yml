name: e2e
on:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
      # CI-only: browser tests post quickly from one Member; the default limit is
      # covered by the server tests.
      FUKULOW_SEND_BURST: '10000'
      FUKULOW_SEND_REFILL_PER_SECOND: '1000'
      # #800: databases for the 4 Playwright workers (the CI default in web/playwright.config.ts).
      E2E_WORKERS: '4'
      # #800 PR 1: CI reads no debuginfo (no RUST_BACKTRACE; panics keep file:line). Release, wasm-release and Docker builds are unchanged. Part of the rust-cache key.
      CARGO_PROFILE_DEV_DEBUG: '0'
      # A Playwright bump must update the tag and digest together.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@v7
      # #800: overlap the image download with the builds. The smoke step still runs its bounded,
      # digest-pinned pull (a no-op once this finishes) and `--pull never`.
      - name: Prefetch the Playwright image in the background
        run: nohup docker pull --quiet "$PLAYWRIGHT_IMAGE" > /dev/null 2> /dev/null &
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: rustup toolchain install --profile minimal
      # Prebuilt, checksum-verified binary: `cargo install` compiled it for 60-90 s in every job.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: wasm-bindgen@0.2.130 }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Provision least-privilege connection and run one-shot migrations
        shell: bash
        env:
          POSTGRES_APP_PASSWORD: ci-e2e-app-only
        run: |
          set -euo pipefail
          target/debug/fukulow-server migrate roles
          target/debug/fukulow-server migrate
          # Worker 0 uses postgres; worker i uses postgres_w<i>.
          for i in $(seq 1 $((E2E_WORKERS - 1))); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE postgres_w${i}"
            DATABASE_URL="${DATABASE_URL}_w${i}" target/debug/fukulow-server migrate
          done
      - name: Use only the app role for browser tests
        run: echo 'DATABASE_URL=postgres://fukulow_app:ci-e2e-app-only@127.0.0.1:5432/postgres' >> "$GITHUB_ENV"
      # Keep Rust and its cache on the runner; only the browser tests need the image's libraries.
      # Host networking preserves the loopback Postgres URL and Playwright webServer URL.
      - name: Run smoke with preinstalled Chromium (no apt)
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 60s docker pull "$PLAYWRIGHT_IMAGE"; then
            echo '::error::Playwright image pull failed or exceeded 60 seconds'
            exit 1
          fi
          docker run --pull never --rm --init --network host --ipc host \
            --user "$(id -u):$(id -g)" \
            --env CI --env DATABASE_URL --env FUKULOW_SEND_BURST --env FUKULOW_SEND_REFILL_PER_SECOND \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TOOL_CACHE:$RUNNER_TOOL_CACHE:ro" \
            --workdir "$GITHUB_WORKSPACE/web" \
            --entrypoint "$(command -v node)" \
            "$PLAYWRIGHT_IMAGE" node_modules/@playwright/test/cli.js test
      - name: Verify named E2E invariants passed
        run: node web/scripts/check-e2e-invariants.ts
      - name: Upload restricted E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: web/test-results/ci-diagnostics/report.json
          retention-days: 3
          if-no-files-found: ignore
