name: wasm-budget
# Label changes re-run the cap comparison without rebuilding Wasm.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: wasm-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  budget-raise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Wasm cap raises need the wasm:budget-raise label
        env:
          WASM_BUDGET_RAISE_LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'wasm:budget-raise') }}
        run: |
          # The merge commit's first parent is the current base tip.
          base_budget=$(git ls-tree --name-only HEAD^1 -- scripts/wasm-budget.json)
          if [[ -z "$base_budget" ]]; then
            echo 'The base branch has no Wasm budget yet.'
            exit 0
          fi
          git show HEAD^1:scripts/wasm-budget.json > "$RUNNER_TEMP/base-wasm-budget.json"
          node scripts/check-wasm-budget-raise.ts "$RUNNER_TEMP/base-wasm-budget.json"
