name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *" # nightly (UTC)
permissions:
  contents: read
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      # All dependencies: Svelte and other runtime code are in devDependencies but ship in the built bundle.
      - run: node scripts/npm-audit-gate.ts web load
