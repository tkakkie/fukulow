name: e2e-cache
on:
  push:
    branches: [main]
permissions:
  contents: read
# #926: e2e.yml runs only on PRs, whose caches no other PR can read. This saves main's `smoke` rust-cache with
# e2e.yml's build steps and job id, so every PR's smoke restores it. It builds only; the smoke tests stay in
# e2e.yml. scripts/e2e-cache.test.ts keeps the steps and the cache-relevant env identical to e2e.yml's.
jobs:
  smoke:
    name: e2e rust-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: wasm-bindgen@0.2.130 }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo build --locked
