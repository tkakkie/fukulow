name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: node --test scripts/check-migrations.test.ts
      - name: Existing migrations are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-migrations.sh "$BASE_SHA"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: node web/scripts/check-invariants.ts
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: web/dist }
  server:
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: web/dist }
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: make api && git diff --exit-code -- openapi.json web/src/api-schema.d.ts
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile caddy up -d --build --wait
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - run: test "$(curl --insecure --retry 10 --retry-connrefused --retry-delay 1 -fsS https://localhost/api/v1/health)" = ok
      - if: failure()
        run: docker compose --profile caddy logs
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - if: always()
        run: docker compose --profile caddy down -v --remove-orphans
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - name: Versions agree (rust-toolchain.toml, .node-version, engines, Dockerfile)
        run: |
          set -euo pipefail
          rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          node=$(tr -d '[:space:]' < .node-version)
          grep -q "^FROM rust:${rust}-slim " Dockerfile
          grep -q "^FROM node:${node}-slim " Dockerfile
          [ "$(node -p "require('./web/package.json').engines.node")" = "$node" ]
