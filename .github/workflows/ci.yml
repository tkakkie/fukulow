name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # PRs: one group per PR, so a newer push cancels the older run. main: unique group per run, so no push is cancelled or queued.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: node --test scripts/check-migrations.test.ts
      - name: Existing migrations are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-migrations.sh "$BASE_SHA"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Documentation fits per-file and total byte budgets
        run: node web/scripts/check-doc-budgets.ts
      - run: rustup toolchain install --profile minimal
      # Prebuilt, checksum-verified binary: `cargo install` compiled it for 60-90 s in every job.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: wasm-bindgen@0.2.130 }
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: npm --prefix web run build
  # Linting needs no DB or real SPA: an empty web/dist satisfies rust-embed for clippy, so lint runs alongside `web`.
  lint:
    runs-on: ubuntu-latest
    env:
      # #800 PR 1: CI never reads full debuginfo. Release, wasm and Docker builds are unchanged; this value is part of the rust-cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        # PR-ref caches are readable only by that PR; saving them evicts main's (10 GB repository limit).
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: mkdir -p web/dist
      - run: cargo build -p fukulow-api -p fukulow-client-core --target wasm32-unknown-unknown --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features fukulow-client-core/wasm -- -D warnings
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: load/package-lock.json }
      - run: npm --prefix load ci --ignore-scripts
      - run: npm --prefix load run check && npm --prefix load test
  # server-tests and checks build the real SPA themselves (a few seconds) instead of waiting for the whole `web` job.
  # The server tests run as 3 nextest partitions in parallel; every test still runs on every PR.
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
      # #800 PR 1: CI never reads full debuginfo. Release, wasm and Docker builds are unchanged; this value is part of the rust-cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: rustup toolchain install --profile minimal
      # Prebuilt, checksum-verified binary: `cargo install` compiled it for 60-90 s in every job.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: wasm-bindgen@0.2.130 }
      - run: npm --prefix web ci # also for the invariants check, which imports typescript
      - run: npm --prefix web run build
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        # Shards build the same target; one main save is enough (PR-ref saves would evict main's, 10 GB limit).
        with: { save-if: "${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}" }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: cargo-nextest@0.9.151 }
      # nextest schedules tests of all binaries in one pool (cargo test runs lib, main and tests/*.rs one after another).
      # Keep the build flags in sync with cargo nextest list in web/scripts/check-invariants.ts.
      - run: cargo nextest run --locked --features fukulow-client-core/wasm --no-fail-fast --partition count:${{ matrix.shard }}/3
      - if: matrix.shard == 1
        run: cargo test --locked --doc # nextest does not run doctests
      - if: matrix.shard == 1
        run: node web/scripts/check-invariants.ts # Lists runnable tests across all shards using the same nextest build. Requires cargo and nextest.
  # Keeps the required `server` check: it passes only when every shard passed (failed, cancelled or skipped fails).
  server:
    needs: server-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.server-tests.result }}
        run: test "$RESULT" = success
  checks:
    runs-on: ubuntu-latest
    env:
      # #800 PR 1: CI never reads full debuginfo. Release, wasm and Docker builds are unchanged; this value is part of the rust-cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: rustup toolchain install --profile minimal
      # Prebuilt, checksum-verified binary: `cargo install` compiled it for 60-90 s in every job.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: wasm-bindgen@0.2.130 }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        # PR-ref caches are readable only by that PR; saving them evicts main's (10 GB repository limit).
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: rustup component add rustc-dev
      # Ubuntu's age package (approved encryption tool, #316); REQUIRE_AGE turns the roundtrip skip into a failure.
      - name: Install age for the backup encryption roundtrip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          age --version && age-keygen --version
      - name: Script tests including cache credential scope, backup publication and disposable restore guards
        env: { FUKULOW_REQUIRE_AGE: '1' }
        run: node --test scripts/*.test.ts
      - name: Context settings are transaction-local
        run: |
          node scripts/check-local-context.ts
      - run: rustfmt --check --edition 2024 scripts/module-direction.rs
      - run: node scripts/check-module-direction.ts
      - run: make api && git diff --exit-code -- openapi.json web/src/api-schema.d.ts
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Versions agree (toolchains, engines, Dockerfile, Playwright image)
        run: |
          node --test scripts/check-versions.test.ts
          node scripts/check-versions.ts
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-compose-only
      POSTGRES_APP_PASSWORD: ci-compose-app-only
      FUKULOW_SETUP_TOKEN: ci-setup-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Compose security configuration and rejection checks
        run: node --test scripts/compose-security.test.ts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Only main writes the layer cache: a PR export once hung for 17 minutes, and PRs read main's layers anyway.
      - name: Build image with GitHub Actions layer cache
        id: build-image
        timeout-minutes: 20
        # Like e2e-compose, only the action's build child inherits cache credentials.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error("Actions cache credentials are not available");
            }
            const args = ["buildx", "bake", "--load", "--file", "compose.yml",
              "--set", "app.cache-from=type=gha,scope=docker"];
            if (context.eventName === "push") {
              args.push("--set", "app.cache-to=type=gha,scope=docker,mode=max");
            }
            await exec.exec("docker", args);
      # The profiles run side by side as separate Compose projects with ephemeral ports (~130 s in sequence).
      # Distinct edge subnets keep the two projects apart.
      - name: Both proxy profiles reject forwarded-IP spoofing
        run: |
          CHECK_COMPOSE_PROFILE=caddy CHECK_EDGE_PREFIX="10.140.$((RANDOM % 256))" node scripts/check-compose-security.ts > "$RUNNER_TEMP/security-caddy.log" 2>&1 & caddy=$!
          CHECK_COMPOSE_PROFILE=nginx CHECK_EDGE_PREFIX="10.141.$((RANDOM % 256))" node scripts/check-compose-security.ts > "$RUNNER_TEMP/security-nginx.log" 2>&1 & nginx=$!
          status=0
          wait "$caddy" || status=1
          wait "$nginx" || status=1
          for profile in caddy nginx; do echo "::group::$profile"; cat "$RUNNER_TEMP/security-$profile.log"; echo "::endgroup::"; done
          exit "$status"
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
      - name: Database roles fail closed and never export passwords to logs or SQL snapshots
        run: node scripts/check-db-roles.ts
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
      - name: Fetch upgrade source
        run: git fetch origin main --depth=1
      - name: Build old image with GitHub Actions layer cache
        id: build-upgrade-image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error("Actions cache credentials are not available");
            }
            const fs = require("node:fs");
            const path = require("node:path");
            const source = fs.mkdtempSync(path.join(require("node:os").tmpdir(), "fukulow-upgrade-build-"));
            const archive = `${source}.tar`;
            const env = { PATH: process.env.PATH };
            try {
              await exec.exec("git", ["archive", "--format=tar", "--output", archive, "origin/main"], { env });
              await exec.exec("tar", ["-xf", archive, "-C", source], { env });
              await exec.exec("docker", ["buildx", "build", "--load", "--cache-from", "type=gha,scope=docker",
                "-q", "-t", "fukulow-upgrade-main", source]);
            } finally {
              fs.rmSync(archive, { force: true });
              fs.rmSync(source, { recursive: true, force: true });
            }
      - name: Upgrade populated main volume and verify backup/restore with app grants
        run: node scripts/check-db-upgrade.ts
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
          CHECK_UPGRADE_OLD_IMAGE: fukulow-upgrade-main
      - run: docker compose --profile caddy up -d --no-build --wait
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - run: test "$(curl --insecure --retry 10 --retry-connrefused --retry-delay 1 -fsS https://localhost/api/v1/health)" = ok
      - name: Light k6 run (10 seconds; hard limit 55 seconds)
        env:
          LOAD_BOOTSTRAP: '1'
          LOAD_EMAIL: load@example.test
          LOAD_PASSWORD: ci-load-test-only-password
          LOAD_SETUP_TOKEN: ci-setup-test-only
          K6_INSECURE_SKIP_TLS_VERIFY: 'true'
          PUBLISH_MEMBERS: '8'
        run: timeout 55s make load LOAD_CONTAINER_NAME=fukulow-ci-load BASE_URL=https://localhost
      - name: Remove load container even after timeout
        if: always()
        run: docker rm -f fukulow-ci-load || true
      - if: failure()
        run: docker compose --profile caddy logs
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - if: always()
        run: docker compose --profile caddy down -v --remove-orphans
        env:
          POSTGRES_PASSWORD: ci-compose-only
