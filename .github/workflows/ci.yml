name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # PRs: one group per PR, so a newer push cancels the older run. main: unique group per run, so no push is cancelled or queued.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: node --test scripts/check-migrations.test.ts
      - name: Existing migrations are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-migrations.sh "$BASE_SHA"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: web/dist, include-hidden-files: true }
  # fmt and clippy only compile (no DB, no real SPA): an empty web/dist satisfies rust-embed, so they run alongside `web`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: load/package-lock.json }
      - run: npm --prefix load ci --ignore-scripts
      - run: npm --prefix load run check && npm --prefix load test
  server:
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:ci-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: web/dist }
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-nextest@0.9.151 }
      # nextest schedules tests of all binaries in one pool (cargo test runs lib, main and tests/*.rs one after another).
      - run: cargo nextest run --no-fail-fast
      - run: cargo test --doc # nextest does not run doctests
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci # the invariants check imports typescript
      - run: node web/scripts/check-invariants.ts # reuses the test build of `cargo nextest run` above (no extra cold build); fails if cargo is missing
  checks:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: web/dist }
      - run: rustup toolchain install --profile minimal  # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Backup publication and disposable restore guards
        run: node --test scripts/backup.test.ts
      - run: rustup component add rustc-dev
      - run: rustfmt --check --edition 2024 scripts/module-direction.rs
      - run: node --test scripts/check-module-direction.test.ts
      - run: node scripts/check-module-direction.ts
      - run: make api && git diff --exit-code -- openapi.json web/src/api-schema.d.ts
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Versions agree (rust-toolchain.toml, .node-version, engines, Dockerfile)
        run: |
          node --test scripts/check-versions.test.ts
          node scripts/check-versions.ts
  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-only
      POSTGRES_APP_PASSWORD: ci-compose-app-only
      FUKULOW_SETUP_TOKEN: ci-setup-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Compose security configuration and rejection checks
        run: node --test scripts/compose-security.test.ts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose GitHub Actions cache credentials to buildx bake
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!url || !token) { throw new Error("Actions cache credentials are not available"); }
            core.exportVariable("ACTIONS_RESULTS_URL", url);
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", token);
      - name: Build image with GitHub Actions layer cache
        run: docker buildx bake --load --file compose.yml --set "app.cache-from=type=gha,scope=docker" --set "app.cache-to=type=gha,scope=docker,mode=max"
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - name: Both proxy profiles reject forwarded-IP spoofing
        run: node scripts/check-compose-security.ts
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
      - name: Database roles fail closed and never export passwords to logs or SQL snapshots
        run: node scripts/check-db-roles.ts
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
      - name: Upgrade populated main volume and verify backup/restore with app grants
        run: |
          git fetch origin main --depth=1
          node scripts/check-db-upgrade.ts
        env:
          CHECK_COMPOSE_IMAGE: fukulow-app
      - run: docker compose --profile caddy up -d --no-build --wait
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - run: test "$(curl --insecure --retry 10 --retry-connrefused --retry-delay 1 -fsS https://localhost/api/v1/health)" = ok
      - name: Light k6 run (10 seconds; hard limit 55 seconds)
        env:
          LOAD_BOOTSTRAP: '1'
          LOAD_EMAIL: load@example.test
          LOAD_PASSWORD: ci-load-test-only-password
          LOAD_SETUP_TOKEN: ci-setup-test-only
          K6_INSECURE_SKIP_TLS_VERIFY: 'true'
        run: timeout 55s make load LOAD_CONTAINER_NAME=fukulow-ci-load BASE_URL=https://localhost
      - name: Remove load container even after timeout
        if: always()
        run: docker rm -f fukulow-ci-load || true
      - if: failure()
        run: docker compose --profile caddy logs
        env:
          POSTGRES_PASSWORD: ci-compose-only
      - if: always()
        run: docker compose --profile caddy down -v --remove-orphans
        env:
          POSTGRES_PASSWORD: ci-compose-only
