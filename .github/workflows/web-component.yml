name: web-component
on:
  pull_request:
permissions:
  contents: read
# #449: browser component tests (web/e2e-component) on Vite's dev server; no server, database or wasm build.
# Separate from e2e.yml, whose smoke job check-invariants.ts (via playwright-ci.ts) verifies as the only Playwright run.
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm --prefix web run e2e:component
