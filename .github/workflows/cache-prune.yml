name: cache-prune
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
# #926: deletes superseded main cache entries (scripts/actions-cache-prune.ts) so usage stays under 8 GB.
# Deleting needs actions: write, so this job runs only repository code from the default branch, installs
# nothing and keeps the token out of git config and every step but the prune.
permissions:
  contents: read
  actions: write
concurrency:
  group: cache-prune
  cancel-in-progress: false
jobs:
  prune:
    # A dispatch from another branch would run that branch's script with the write token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - name: Delete superseded cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/actions-cache-prune.ts --apply
