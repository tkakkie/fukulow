name: e2e-compose
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# #150 Sprint 2 gate: dispatch this workflow on the release candidate and require
# a successful run. Keep expensive Compose acceptance outside PR feedback.
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [caddy, nginx]
    env:
      COMPOSE_PROJECT_NAME: fukulow-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      CHECK_COMPOSE_PROJECT: fukulow-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      CHECK_COMPOSE_PROFILE: ${{ matrix.profile }}
      CHECK_COMPOSE_IMAGE: fukulow-app
      CHECK_COMPOSE_ACCEPTANCE: '1'
      CHECK_COMPOSE_WORK_DIR: ${{ runner.temp }}
      POSTGRES_PASSWORD: ci-compose-only
      POSTGRES_APP_PASSWORD: ci-compose-app-only
      FUKULOW_SETUP_TOKEN: ci-compose-setup-only
      FUKULOW_COOKIE_SECURE: 'true'
      FUKULOW_DOMAIN: fukulow.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated image with existing CI layer cache
        id: build-image
        # Run bake inside the action so the cache-writing runtime token reaches only
        # this child process, never later steps running npm and browser code.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error("Actions cache credentials are not available");
            }
            await exec.exec("docker", ["buildx", "bake", "--load",
              "--file", "compose.yml",
              "--set", "app.cache-from=type=gha,scope=docker",
              "--set", "app.cache-to=type=gha,scope=docker,mode=max"]);
      - name: Pebble HTTPS probe, browser acceptance, proxy parity and certificate lifecycle
        run: node scripts/check-compose-security.ts
      - name: Upload restricted Compose E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-compose-${{ matrix.profile }}-failure-diagnostics
          path: web/test-results/ci-diagnostics/report.json
          retention-days: 3
          if-no-files-found: ignore
      # #254 supersedes #211's traces/screenshots request. No screenshots: the
      # setup form can contain the token. No Compose logs: auth.rs logs unfiltered
      # sqlx errors, so database diagnostics cannot be certified secret-free.
      - name: Remove stack and all disposable volumes
        if: always()
        run: docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" --profile "${{ matrix.profile }}" down -v --remove-orphans
