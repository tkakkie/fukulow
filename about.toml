# Third-party notices for the shipped Rust code (#807): cargo about generate --format json, rendered by scripts/third-party-notices.ts.
# `accepted` must equal deny.toml [licenses] allow (scripts/third-party-notices.test.ts).
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0",
  "ISC", "Zlib", "CDLA-Permissive-2.0",
]
# The image's server binary (amd64 or arm64 Linux) and the browser wasm core.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]
ignore-dev-dependencies = true
private = { ignore = true }
