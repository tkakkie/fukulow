# Default: `docker compose --profile caddy up -d`  (or `--profile nginx`)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FUKULOW_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://fukulow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fukulow
      FUKULOW_COOKIE_SECURE: ${FUKULOW_COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: fukulow
      POSTGRES_DB: fukulow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fukulow -d fukulow"]
      interval: 2s
      timeout: 5s
      retries: 15

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # Public domain for automatic HTTPS (DNS must point to this host; ports 80/443 open).
      FUKULOW_DOMAIN: ${FUKULOW_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  nginx:
    profiles: ["nginx"]
    image: nginx:1
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  caddy_data:
  postgres_data:
