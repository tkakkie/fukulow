# Default: `docker compose --profile caddy up -d`  (or `--profile nginx`)
services:
  app:
    stop_grace_period: 75s
    image: fukulow-app
    build: .
    restart: unless-stopped
    environment:
      FUKULOW_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://fukulow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fukulow
      FUKULOW_COOKIE_SECURE: ${FUKULOW_COOKIE_SECURE:-true}
      FUKULOW_WS_ALLOWED_ORIGINS:
      FUKULOW_SETUP_TOKEN: ${FUKULOW_SETUP_TOKEN:?Set FUKULOW_SETUP_TOKEN in .env}
      FUKULOW_TRUSTED_PROXIES: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
      FUKULOW_CLIENT_IP_HEADER: x-forwarded-for
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        # Reserve a separate address so Docker cannot give the app the proxy's IP.
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.3
      backend:

  db:
    image: postgres:18
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: fukulow
      POSTGRES_DB: fukulow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fukulow -d fukulow"]
      interval: 2s
      timeout: 5s
      retries: 15

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    networks:
      edge:
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
    ports: ["80:80", "443:443"]
    environment:
      # Public domain for automatic HTTPS (DNS must point to this host; ports 80/443 open).
      FUKULOW_DOMAIN: ${FUKULOW_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  nginx:
    profiles: ["nginx"]
    image: nginx:1
    restart: unless-stopped
    depends_on: [app]
    networks:
      edge:
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  edge:
    ipam:
      config:
        - subnet: ${FUKULOW_EDGE_PREFIX:-172.30.94}.0/29
          gateway: ${FUKULOW_EDGE_PREFIX:-172.30.94}.1
          ip_range: ${FUKULOW_EDGE_PREFIX:-172.30.94}.4/30
  backend:

volumes:
  caddy_data:
  postgres_data:
