# Default: `docker compose --profile caddy up -d`  (or `--profile nginx`)
services:
  app:
    stop_grace_period: 75s
    image: fukulow-app
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "fukulow-server", "probe"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    environment:
      FUKULOW_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://fukulow_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@db:5432/fukulow
      FUKULOW_COOKIE_SECURE: ${FUKULOW_COOKIE_SECURE:-true}
      FUKULOW_WS_ALLOWED_ORIGINS:
      FUKULOW_SETUP_TOKEN: ${FUKULOW_SETUP_TOKEN:?Set FUKULOW_SETUP_TOKEN in .env}
      FUKULOW_TRUSTED_PROXIES: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
      FUKULOW_CLIENT_IP_HEADER: x-forwarded-for
      # Send limit per (Organization, Member); production keeps 10 and 1/s.
      FUKULOW_SEND_BURST: ${FUKULOW_SEND_BURST:-10}
      FUKULOW_SEND_REFILL_PER_SECOND: ${FUKULOW_SEND_REFILL_PER_SECOND:-1}
      FUKULOW_DB_MAX_CONNECTIONS: ${FUKULOW_DB_MAX_CONNECTIONS-20}
      FUKULOW_DB_ACQUIRE_TIMEOUT_MS: ${FUKULOW_DB_ACQUIRE_TIMEOUT_MS-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      edge:
        # Reserve a separate address so Docker cannot give the app the proxy's IP.
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.3
      backend:

  migrate:
    image: fukulow-app
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    entrypoint: ["fukulow-server", "migrate"]
    command: []
    restart: "no"
    networks: [backend]
    environment:
      DATABASE_URL: postgres://fukulow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fukulow
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [backend]
    environment:
      POSTGRES_USER: fukulow
      POSTGRES_DB: fukulow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db-roles.sh:/docker-entrypoint-initdb.d/10-db-roles.sh:ro
      - ./deploy/db-roles.sql:/opt/fukulow/db-roles.sql:ro
      - ./deploy/db-role-settings.sql:/opt/fukulow/db-role-settings.sql:ro
      - ./deploy/db-grants.sql:/opt/fukulow/db-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fukulow -d fukulow"]
      interval: 2s
      timeout: 5s
      retries: 15

  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    depends_on: [app]
    networks:
      edge:
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
    ports: ["80:80", "443:443"]
    environment:
      # Public domain for automatic HTTPS (DNS must point to this host; ports 80/443 open).
      FUKULOW_DOMAIN: ${FUKULOW_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  nginx:
    profiles: ["nginx"]
    image: nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    depends_on: [app]
    networks:
      edge:
        ipv4_address: ${FUKULOW_EDGE_PREFIX:-172.30.94}.2
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  edge:
    ipam:
      config:
        - subnet: ${FUKULOW_EDGE_PREFIX:-172.30.94}.0/29
          gateway: ${FUKULOW_EDGE_PREFIX:-172.30.94}.1
          ip_range: ${FUKULOW_EDGE_PREFIX:-172.30.94}.4/30
  backend:

volumes:
  caddy_data:
  postgres_data:
