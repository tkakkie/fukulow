[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# Reserve all slots for the 512-socket contract's shared Postgres load and tests
# with real 1s admission expiry, bounded storm progress or 100-200ms fallback
# checks. The paused-time 512-socket contract does not assert wall-clock capacity.
[[profile.default.overrides]]
filter = '''
test(=realtime::tests::watermark::simultaneous_admitted_subscriptions_receive_canonical_live_messages)
| test(=realtime::tests::watermark::watermark_admission_expiry_closes_with_internal_error)
| test(=realtime::tests::watermark::unresolved_commit_reconnect_storm_leaves_pool_headroom_for_other_organizations_and_channels)
| test(=realtime::tests::access_loss::fallback_detects_dropped_signal_remove_regrant_lifetime_and_fails_closed)
| test(=realtime::tests::session::fallback_database_failure_closes_with_internal_error)
'''
threads-required = "num-test-threads"

# The projection oracle cases took up to 89s on green CI.
[[profile.default.overrides]]
filter = '''
test(=messages::tests::unread::a3_oracle::projection::topic_pages_equal_the_prefix_query_after_every_random_step)
| test(=messages::tests::unread::a3_oracle::projection::topic_pages_equal_the_prefix_query_after_every_random_step_seed_1)
| test(=messages::tests::unread::a3_oracle::projection::topic_pages_equal_the_prefix_query_after_every_random_step_seed_2)
'''
slow-timeout = { period = "60s", terminate-after = 3 }

# #800: start the longest tests first so they overlap the short ones instead of
# setting each CI shard's tail. Order only; every test still runs.
[[profile.default.overrides]]
filter = '''
test(/^messages::tests::unread::a3_oracle::projection::topic_pages_equal_the_prefix_query_after_every_random_step/)
| test(/^messages::tests::unread::a3_oracle::a3_counts_equal_the_pre_a3_query_after_every_random_step/)
| test(=messages::tests::unread::roles::unread_all_roles_visibility_grants_and_access_changes_match_positions)
| test(=messages::tests::topics::page_plans::topic_pages_bound_message_and_topic_buffers_in_both_plan_modes)
| test(=recorded_fixtures_and_seeded_sequences_match_every_step)
| test(=realtime::tests::watermark::repeated_send_transaction_timeouts_clear_residue_and_preserve_other_organization_progress)
| test(=realtime::tests::contract::delivery_contract_scenarios)
'''
priority = 100
