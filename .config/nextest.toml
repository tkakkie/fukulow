# Reserve all slots for the 512-socket contract's shared Postgres load and tests
# with real 1s admission expiry, bounded storm progress or 100-200ms fallback
# checks. The paused-time 512-socket contract does not assert wall-clock capacity.
[[profile.default.overrides]]
filter = '''
test(=realtime::tests::watermark::simultaneous_admitted_subscriptions_receive_canonical_live_messages)
| test(=realtime::tests::watermark::watermark_admission_expiry_closes_with_internal_error)
| test(=realtime::tests::watermark::unresolved_commit_reconnect_storm_leaves_pool_headroom_for_other_organizations_and_channels)
| test(=realtime::tests::access_loss::fallback_detects_dropped_signal_remove_regrant_lifetime_and_fails_closed)
| test(=realtime::tests::session::fallback_database_failure_closes_with_internal_error)
'''
threads-required = "num-test-threads"
