# Use with compose.yml and COMPOSE_PROFILES=none. The app's HTTP listener is private to the proxy.
services:
  caddy: !reset null
  nginx: !reset null
  app:
    profiles: [none]
    ports:
      - host_ip: ${FUKULOW_PUBLISH_ADDR:-127.0.0.1}
        published: ${FUKULOW_PUBLISH_PORT:-8080}
        target: ${FUKULOW_CONTAINER_PORT:-8080}
    environment:
      FUKULOW_ADDR: 0.0.0.0:${FUKULOW_CONTAINER_PORT:-8080}
      FUKULOW_ALLOWED_HOST: ${FUKULOW_DOMAIN:?Set FUKULOW_DOMAIN to the public Host in .env}
      FUKULOW_COOKIE_SECURE: "true"
      FUKULOW_TRUSTED_PROXIES:
      FUKULOW_CLIENT_IP_HEADER:
