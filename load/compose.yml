# Disposable measurement environment; never shares production/E2E images, ports or volumes.
services:
  app:
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    image: ${LOAD_APP_IMAGE:-${LOAD_PROJECT:?Set LOAD_PROJECT}-app}
    build:
      context: ${LOAD_SERVER_SOURCE:-..}
    stop_grace_period: 75s
    ulimits:
      nofile: 65536
    environment:
      FUKULOW_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://fukulow_app:${LOAD_APP_PASSWORD:?Set LOAD_APP_PASSWORD}@db:5432/fukulow
      FUKULOW_COOKIE_SECURE: "false"
      FUKULOW_SETUP_TOKEN: ${LOAD_SETUP_TOKEN:?Set LOAD_SETUP_TOKEN for the disposable stack}
    ports:
      - "127.0.0.1:${LOAD_PORT:?Set LOAD_PORT}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: ${LOAD_APP_IMAGE:-${LOAD_PROJECT:?Set LOAD_PROJECT}-app}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    command: ["fukulow-server", "migrate"]
    environment:
      DATABASE_URL: postgres://fukulow:${LOAD_DB_PASSWORD:?Set LOAD_DB_PASSWORD}@db:5432/fukulow
      POSTGRES_APP_PASSWORD: ${LOAD_APP_PASSWORD:?Set LOAD_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: fukulow
      POSTGRES_DB: fukulow
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD}
      POSTGRES_APP_PASSWORD: ${LOAD_APP_PASSWORD}
    volumes:
      - ../deploy/init-db-roles.sh:/docker-entrypoint-initdb.d/10-db-roles.sh:ro
      - ../deploy/db-roles.sql:/opt/fukulow/db-roles.sql:ro
      - ../deploy/db-role-settings.sql:/opt/fukulow/db-role-settings.sql:ro
      - ../deploy/db-grants.sql:/opt/fukulow/db-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fukulow -d fukulow"]
      interval: 1s
      timeout: 5s
      retries: 30
