[workspace]
members = ["server", "api-types", "client-core"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Tests hash passwords often; unoptimized Argon2 made tests/auth.rs ~5x slower (11.8s -> 2.4s locally). Release builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Only the browser wasm build uses this profile (scripts/build-wasm.ts, Dockerfile); server release builds are unchanged.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
